<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration & Fee Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Conference Registration</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="register.html" class="active">Register</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <form id="regForm" action="process.php" method="POST" onsubmit="return validateForm()">
            <h2>Participant Registration Form</h2>
            <div id="error-message" class="error"></div>

            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>

            <div class="form-group">
                <label for="admission">Admission / Registration Number:</label>
                <input type="text" id="admission" name="admission" placeholder="e.g. CT100/G/24390/24">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Exact 10 digits):</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="yos">Year of Study:</label>
                <select id="yos" name="yos">
                    <option value="">--Select Year--</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Participation Category:</label>
                <select id="category" name="category" onchange="showWorkshop()">
                    <option value="">--Select Category--</option>
                    <option value="Conference Only">Conference Only</option>
                    <option value="Workshop Participant">Workshop Participant</option>
                </select>
            </div>

            <div class="form-group">
                <label for="days">Number of Conference Days (1 to 3):</label>
                <input type="number" id="days" name="days" min="1" max="3" value="1" oninput="calculateFee()">
            </div>

            <div class="form-group" id="workshop-group" style="display:none;">
                <label>
                    <input type="checkbox" id="workshop" name="workshop" value="yes" onchange="calculateFee()"> 
                    Participate in Advanced Web Workshop (KSh 750)
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="catering-check" name="catering_check" value="yes" onchange="showMeals()"> 
                    Include Catering / Meals
                </label>
            </div>

            <div class="form-group" id="meal-group" style="display:none;">
                <label>
                    <input type="checkbox" id="meals" name="meals" value="yes" onchange="calculateFee()"> 
                    Lunch per day (KSh 300 / day)
                </label>
            </div>

            <div class="summary-box">
                <h3>Fee Breakdown & Summary</h3>
                <p>Conference Registration: KSh 1,000</p>
                <p id="discount-notice" style="color: green; font-weight: bold; display: none;">10% 3-Day Attendance Discount Applied!</p>
                <p class="total-display">Total Amount Payable: <span id="total-display">KSh 1,750</span></p>
                <input type="hidden" id="total_amount" name="total_amount" value="1750">
            </div>

            <button type="submit" class="btn">Submit Registration</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Technology and Innovation Conference.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
